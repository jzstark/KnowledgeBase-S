name: Build & Push Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:  # 允许在 GitHub Actions 页面手动触发，构建全部服务

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      ingestion: ${{ steps.filter.outputs.ingestion }}
      summarizer: ${{ steps.filter.outputs.summarizer }}
      kb_mcp: ${{ steps.filter.outputs.kb_mcp }}
      lifecycle: ${{ steps.filter.outputs.lifecycle }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'services/web/**'
            api:
              - 'services/api/**'
            ingestion:
              - 'services/ingestion-worker/**'
            summarizer:
              - 'services/summarizer-worker/**'
            kb_mcp:
              - 'services/kb-mcp/**'
              - '.github/workflows/build.yml'
            lifecycle:
              - 'services/api/**'
              - 'services/ingestion-worker/**'
              - 'config/**'
              - 'scripts/test_document_lifecycle.sh'
              - '.github/workflows/build.yml'

  lifecycle-tests:
    needs: changes
    if: needs.changes.outputs.lifecycle == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kb_lifecycle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kb_lifecycle_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/api/requirements.txt pytest
      - run: bash scripts/test_document_lifecycle.sh
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/kb_lifecycle_test

  build-web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: services/web
          push: true
          tags: ghcr.io/jzstark/web:latest

  build-api:
    needs: [changes, lifecycle-tests]
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: services/api
          push: true
          tags: ghcr.io/jzstark/api:latest

  build-ingestion:
    needs: [changes, lifecycle-tests]
    if: needs.changes.outputs.ingestion == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: services/ingestion-worker
          push: true
          tags: ghcr.io/jzstark/ingestion-worker:latest

  build-summarizer:
    needs: changes
    if: needs.changes.outputs.summarizer == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: services/summarizer-worker
          push: true
          tags: ghcr.io/jzstark/summarizer-worker:latest

  build-kb-mcp:
    needs: changes
    if: needs.changes.outputs.kb_mcp == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: services/kb-mcp
          push: true
          # Keep an immutable rollback tag and publish the Watchtower-managed
          # stable tag from main only.
          tags: |
            ghcr.io/jzstark/kb-mcp:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/jzstark/kb-mcp:stable' || '' }}
